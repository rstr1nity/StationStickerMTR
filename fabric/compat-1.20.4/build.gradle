plugins { id 'fabric-loom' }
def shared=new Properties();file('../../gradle.properties').withInputStream { shared.load(it) }
repositories { maven { url='https://api.modrinth.com/maven' }; mavenCentral() }
java { toolchain.languageVersion=JavaLanguageVersion.of(17) }
dependencies {
 minecraft "com.mojang:minecraft:${minecraft_version}"
 mappings loom.officialMojangMappings()
 modImplementation "net.fabricmc:fabric-loader:${shared.fabric_loader_version}"
 modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
 modImplementation "maven.modrinth:minecraft-transit-railway:FABRIC-${shared.fabric_mtr_version}+${minecraft_version}"
 // Test the actual remapped 1.20.1 release jar; never recompile its sources for 1.20.4.
 modRuntimeOnly files("../build/libs/StationStickerMTR-Fabric-${shared.mod_version}+${shared.minecraft_version}.jar")
}
loom { runs { client { runDir('run-client') } } }
