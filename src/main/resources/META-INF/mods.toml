modLoader="javafml"
loaderVersion="${loader_version_range}"
license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="Station Sticker"
description='''
Adds customizable station name stickers that automatically display the station name and line color.
    Place them along platforms for better navigation, just like in real metro systems!
'''
authors="Tr1nity"
logoFile="logo.png"
credits="Thanks to the MTR team and kykko"

[[dependencies.stationsticker]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.stationsticker]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.stationsticker]]
modId="mtr"
mandatory=true
versionRange="${mtr_version_range}"
ordering="AFTER"
side="BOTH"