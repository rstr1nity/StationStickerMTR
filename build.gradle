buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'

group = 'com.yourname.stationsticker'
version = '1.0.0'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.19.2'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                stationsticker {
                    source sourceSets.main
                }
            }
        }
    }
}

// ГЛАВНОЕ - указываем папку с локальными jar файлами
repositories {
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
}

dependencies {
    // Forge
    minecraft 'net.minecraftforge:forge:1.19.2-43.5.0'

    implementation fg.deobf(files('libs/MTR-forge-4.0.3+1.19.2.jar'))
}

jar {
    manifest {
        attributes([
                "Specification-Title": "stationsticker",
                "Specification-Vendor": "stationstickerauthors",
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.version,
                "Implementation-Vendor" :"stationstickerauthors",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}