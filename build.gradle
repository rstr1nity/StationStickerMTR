
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

apply plugin: 'net.minecraftforge.gradle'

group = mod_group_id
version = "${mod_version}+${minecraft_version}"
archivesBaseName = 'StationStickerMTR'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// Исходники в UTF-8, иначе на Windows javac читает их как windows-1251
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    runs {
        client {
            // Своя папка на каждую версию MC: мир из новой версии нельзя открыть в старой
            workingDirectory project.file("run-${minecraft_version}")
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Mixin'ы MTR ссылаются на SRG-имена, в dev-окружении их нужно переводить в официальные
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                stationsticker {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net' }

    // MTR берётся с Modrinth, jar в репозитории не нужен
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }

    mavenCentral()
}

dependencies {
    // Forge
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("maven.modrinth:minecraft-transit-railway:${mtr_maven_version}")
}

// Подстановка версий из gradle.properties в mods.toml и pack.mcmeta
processResources {
    def props = [
            mod_id                 : mod_id,
            mod_version            : mod_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mtr_version_range      : mtr_version_range
    ]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand props
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title": "stationsticker",
                "Specification-Vendor": "stationstickerauthors",
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.version,
                "Implementation-Vendor" :"stationstickerauthors",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
// Копирование jar в игру, только если mods_dir_<версия MC> задан в ~/.gradle/gradle.properties
def modsDirProperty = "mods_dir_${minecraft_version}"
if (project.hasProperty(modsDirProperty)) {
    task copyToMods(type: Copy) {
        from jar
        into project.property(modsDirProperty)
    }

    build.finalizedBy copyToMods
}