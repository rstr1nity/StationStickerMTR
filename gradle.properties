# Память для декомпиляции Minecraft
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

## Окружение (единственное, что отличается между ветками mc/*)
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.3.0
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# MTR с Modrinth Maven: версия = version_number на Modrinth
mtr_version=4.0.3
mtr_maven_version=FORGE-4.0.3+1.20.1
mtr_version_range=[4.0.3,4.1)

## Мод
mod_id=stationsticker
mod_version=1.1.1
mod_group_id=com.tr1nity.stationsticker

# Путь к папке mods для автокопирования jar после сборки задаётся
# в ~/.gradle/gradle.properties (не в репозитории), отдельно на каждую версию MC:
# mods_dir_1.20.1=C:/Users/<user>/AppData/Roaming/.minecraft/mods
